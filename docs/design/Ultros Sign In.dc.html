<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous">
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&amp;family=Hanken+Grotesk:wght@400;500;600;700&amp;family=Spline+Sans+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
  <style>
    html, body { margin: 0; padding: 0; background: #0B0F0D; }
    * { box-sizing: border-box; }
    ::selection { background: rgba(79,178,134,0.35); }
    input::placeholder { color: #5F6F64; }
  </style>
</helmet>

<div data-screen-label="Sign In" style="min-height: 100vh; background: #0B0F0D; color: #ECF1ED; font-family: 'Hanken Grotesk', system-ui, sans-serif; display: flex; flex-direction: column;">

  <!-- Minimal nav -->
  <nav style="max-width: 1120px; width: 100%; margin: 0 auto; padding: 28px 32px; display: flex; align-items: center; justify-content: space-between;">
    <a href="Ultros Landing.dc.html" style="display: flex; align-items: center; gap: 10px; text-decoration: none; color: #ECF1ED;">
      <svg width="26" height="26" viewBox="0 0 32 32" fill="none" aria-label="Ultros logo">
        <path d="M16 6L8 16M16 6L24 16M24 16L19 26M24 16L27 26" stroke="#4FB286" stroke-width="2" stroke-linecap="round"></path>
        <circle cx="16" cy="6" r="3" fill="#0B0F0D" stroke="#4FB286" stroke-width="2"></circle>
        <circle cx="8" cy="16" r="3" fill="#0B0F0D" stroke="#4FB286" stroke-width="2"></circle>
        <circle cx="24" cy="16" r="3" fill="#0B0F0D" stroke="#4FB286" stroke-width="2"></circle>
        <circle cx="19" cy="26" r="3" fill="#4FB286" stroke="#4FB286" stroke-width="2"></circle>
        <circle cx="27" cy="26" r="3" fill="#0B0F0D" stroke="#4FB286" stroke-width="2"></circle>
      </svg>
      <span style="font-family: 'Source Serif 4', Georgia, serif; font-size: 22px; font-weight: 600; letter-spacing: -0.01em;">Ultros</span>
    </a>
    <a href="Ultros Landing.dc.html" style="font-size: 15px; font-weight: 500; color: #9FAFA4; text-decoration: none; white-space: nowrap;" style-hover="color: #ECF1ED;">← Back to site</a>
  </nav>

  <!-- Card -->
  <main style="flex: 1; display: flex; align-items: center; justify-content: center; padding: 48px 32px 96px;">
    <div style="width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 28px;">
      <div style="display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center;">
        <svg width="44" height="44" viewBox="0 0 32 32" fill="none" aria-label="Ultros logo">
          <path d="M16 6L8 16M16 6L24 16M24 16L19 26M24 16L27 26" stroke="#4FB286" stroke-width="2" stroke-linecap="round"></path>
          <circle cx="16" cy="6" r="3" fill="#0B0F0D" stroke="#4FB286" stroke-width="2"></circle>
          <circle cx="8" cy="16" r="3" fill="#0B0F0D" stroke="#4FB286" stroke-width="2"></circle>
          <circle cx="24" cy="16" r="3" fill="#0B0F0D" stroke="#4FB286" stroke-width="2"></circle>
          <circle cx="19" cy="26" r="3" fill="#4FB286" stroke="#4FB286" stroke-width="2"></circle>
          <circle cx="27" cy="26" r="3" fill="#0B0F0D" stroke="#4FB286" stroke-width="2"></circle>
        </svg>
        <h1 style="margin: 0; font-family: 'Source Serif 4', Georgia, serif; font-size: 30px; font-weight: 500; letter-spacing: -0.012em;">Sign in to Ultros</h1>
      </div>

      <div style="background: #121815; border: 1px solid #1B231F; border-radius: 14px; padding: 28px; display: flex; flex-direction: column; gap: 14px;">
        <button style="display: flex; align-items: center; justify-content: center; gap: 10px; font-family: 'Hanken Grotesk', system-ui, sans-serif; font-size: 15px; font-weight: 600; color: #ECF1ED; background: #18201C; border: 1px solid #2E3C33; border-radius: 8px; padding: 12px 20px; cursor: pointer;" style-hover="border-color: #4FB286;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="#ECF1ED" aria-label="GitHub"><path d="M12 1.5a10.5 10.5 0 0 0-3.32 20.46c.53.1.72-.23.72-.5v-1.93c-2.92.63-3.54-1.24-3.54-1.24-.48-1.21-1.17-1.54-1.17-1.54-.95-.65.07-.64.07-.64 1.06.08 1.61 1.08 1.61 1.08.94 1.6 2.46 1.14 3.06.87.1-.68.37-1.14.67-1.4-2.33-.27-4.79-1.17-4.79-5.2 0-1.14.41-2.08 1.08-2.81-.11-.27-.47-1.34.1-2.79 0 0 .88-.28 2.89 1.07a10 10 0 0 1 5.26 0c2-1.35 2.88-1.07 2.88-1.07.58 1.45.22 2.52.11 2.79.67.73 1.08 1.67 1.08 2.81 0 4.04-2.46 4.93-4.81 5.19.38.33.72.97.72 1.96v2.9c0 .28.19.61.73.5A10.5 10.5 0 0 0 12 1.5z"></path></svg>
          Continue with GitHub
        </button>
        <button style="display: flex; align-items: center; justify-content: center; gap: 10px; font-family: 'Hanken Grotesk', system-ui, sans-serif; font-size: 15px; font-weight: 600; color: #ECF1ED; background: #18201C; border: 1px solid #2E3C33; border-radius: 8px; padding: 12px 20px; cursor: pointer;" style-hover="border-color: #4FB286;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-label="Google"><path d="M21.6 12.23c0-.71-.06-1.39-.18-2.05H12v3.88h5.38a4.6 4.6 0 0 1-2 3.02v2.51h3.24c1.89-1.74 2.98-4.3 2.98-7.36z" fill="#9FAFA4"></path><path d="M12 21.5c2.7 0 4.96-.9 6.62-2.42l-3.24-2.51c-.9.6-2.04.96-3.38.96-2.6 0-4.8-1.76-5.59-4.12H3.07v2.59A10 10 0 0 0 12 21.5z" fill="#ECF1ED"></path><path d="M6.41 13.41a6 6 0 0 1 0-3.82V7H3.07a10 10 0 0 0 0 9l3.34-2.59z" fill="#9FAFA4"></path><path d="M12 5.97c1.47 0 2.79.5 3.82 1.5l2.87-2.87A9.97 9.97 0 0 0 3.07 7l3.34 2.59C7.2 7.23 9.4 5.97 12 5.97z" fill="#ECF1ED"></path></svg>
          Continue with Google
        </button>

        <div style="display: flex; align-items: center; gap: 14px; padding: 6px 0;">
          <span style="flex: 1; height: 1px; background: #243029;"></span>
          <span style="font-size: 13px; color: #5F6F64;">or</span>
          <span style="flex: 1; height: 1px; background: #243029;"></span>
        </div>

        <div style="display: flex; flex-direction: column; gap: 8px;">
          <label for="email" style="font-size: 14px; font-weight: 600; color: #9FAFA4;">Work email</label>
          <input id="email" type="email" placeholder="you@company.com" style="font-family: 'Hanken Grotesk', system-ui, sans-serif; font-size: 15px; color: #ECF1ED; background: #0B0F0D; border: 1px solid #2E3C33; border-radius: 8px; padding: 12px 14px; outline: none;" style-focus="border-color: #4FB286;">
        </div>
        <button style="font-family: 'Hanken Grotesk', system-ui, sans-serif; font-size: 15px; font-weight: 600; color: #07130D; background: #4FB286; border: none; border-radius: 8px; padding: 13px 20px; cursor: pointer;" style-hover="background: #5FC296;">Continue with email</button>
      </div>

      <p style="margin: 0; text-align: center; font-size: 14px; color: #5F6F64;">No account yet? <a href="#" style="color: #7FD6AE; text-decoration: none; font-weight: 600;">Start free</a> — no card required.</p>
    </div>
  </main>

</div>
</x-dc>
</body>
</html>
